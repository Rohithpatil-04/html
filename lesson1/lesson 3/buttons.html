<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .subscribe-button
        {
            background-color: red;
            color: rgb(red green blue / alpha);
            border: none;
            height: 36px;
            width: 105px;
            border-radius: 2px;

        }
        .join-button
        {
            background-color: lightblue;
            border-color: rgb(red green blue );
            border-style: solid;
            border-width: 1px;
            color: blue;
            height: 36px;
            width: 62px;
            border-radius: 2px;

        }

        .tweet-button{
            background-color: chartreuse;
            color: black;
            border: none;
            height: 36px;
            width: 74px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-left: 8px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <button class="subscribe-button">SUBSCRIBE</button>
      <button class="join-button">join</button>
      <button class="tweet-button">tweet</button>
</body>
</html>
